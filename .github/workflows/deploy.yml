# Auto-deploy: every push to main builds the site and deploys it to
# Cloudflare Workers — no local terminal needed.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with the "Edit Cloudflare Workers"
#                           permission (+ D1 Edit so the database can be
#                           provisioned and migrated automatically)
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
#
# Until both secrets exist the deploy step simply skips, so pushes
# stay green. The first real push creates the D1 database, applies
# the migration, patches wrangler.jsonc and deploys — hands-free.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: noor-invitations
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping deploy: add the CLOUDFLARE_API_TOKEN and"
            echo "CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy."
            exit 0
          fi

          read_id() {
            node --input-type=module -e "
              import { readFile } from 'node:fs/promises';
              const raw = await readFile('wrangler.jsonc', 'utf8');
              const json = raw.replace(/\/\/.*$/gm, '');
              const match = json.match(/\"database_id\"\s*:\s*\"([^\"]+)\"/);
              console.log(match ? match[1] : '');
            "
          }

          PLACEHOLDER="00000000-0000-0000-0000-000000000000"
          CURRENT_ID=$(read_id)
          echo "Current database_id: ${CURRENT_ID:-none}"

          if [ "$CURRENT_ID" = "$PLACEHOLDER" ] || [ -z "$CURRENT_ID" ]; then
            echo "Creating D1 database ${D1_DATABASE_NAME}…"
            CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME" 2>&1) || { echo "$CREATE_OUT"; exit 1; }
            NEW_ID=$(printf '%s' "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$NEW_ID" ]; then
              echo "Could not parse the new database id:"; echo "$CREATE_OUT"; exit 1
            fi
            echo "Patching wrangler.jsonc with database_id $NEW_ID"
            node --input-type=module -e "
              import { readFile, writeFile } from 'node:fs/promises';
              const raw = await readFile('wrangler.jsonc', 'utf8');
              await writeFile('wrangler.jsonc', raw.replace('$CURRENT_ID', '$NEW_ID'));
            "
          fi

          # ── apply migrations to the remote database ───────────────
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote || {
            echo "Migration step failed (may already be applied) — continuing."; true; }

          # ── ship it ───────────────────────────────────────────────
          npx wrangler deploy
